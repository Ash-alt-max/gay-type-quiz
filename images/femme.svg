<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fff4f4"/><stop offset="100%" stop-color="#f8c8c8"/>
    </radialGradient>
    <linearGradient id="skin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fde8d8"/><stop offset="100%" stop-color="#f8c0a0"/>
    </linearGradient>
    <linearGradient id="outfit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d84848"/><stop offset="100%" stop-color="#781818"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8d868"/><stop offset="40%" stop-color="#e8a830"/><stop offset="100%" stop-color="#c07010"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softglow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="300" rx="20" fill="url(#bg)"/>
  <circle cx="30" cy="50" r="40" fill="#f8d8d8" opacity="0.5"/>
  <circle cx="195" cy="248" r="52" fill="#f0c0c0" opacity="0.35"/>

  <!-- Dramatic sparkles -->
  <path d="M200 55 L202 48 L206 52 L202 56 L200 62 L198 56 L192 52 L198 54Z" fill="#e84848" opacity="0.9" filter="url(#glow)"/>
  <circle cx="22" cy="168" r="5" fill="#e85858" opacity="0.6" filter="url(#glow)"/>
  <path d="M210 160 L211.5 156 L214 158 L211.5 161 L210 164 L208.5 161 L206 158 L208.5 160Z" fill="#f08080" opacity="0.7"/>
  <circle cx="18" cy="90" r="3.5" fill="#e87878" opacity="0.6"/>
  <circle cx="220" cy="220" r="3" fill="#f09090" opacity="0.5"/>

  <!-- Body - dramatic outfit (deep V / bold colors) -->
  <path d="M18 300 Q35 250 76 228 Q100 217 120 216 Q140 217 164 228 Q205 250 222 300Z" fill="url(#outfit)"/>
  <!-- Deep V neckline -->
  <path d="M104 216 L92 255 L120 244 L148 255 L136 216 Q120 208 104 216Z" fill="#b82828"/>
  <!-- Dress/outfit fold -->
  <path d="M88 253 L82 280 L92 276 L100 260Z" fill="#c03030" opacity="0.5"/>
  <path d="M152 253 L158 280 L148 276 L140 260Z" fill="#c03030" opacity="0.5"/>
  <!-- Gold accent trim -->
  <path d="M22 290 Q80 278 120 276 Q160 278 218 290" stroke="#f8c840" stroke-width="3" fill="none" opacity="0.6"/>
  <!-- Collar/choker -->
  <rect x="107" y="210" width="26" height="8" rx="4" fill="#800000"/>
  <circle cx="120" cy="214" r="3" fill="#f8c840"/>

  <!-- Neck -->
  <path d="M107 168 Q120 163 133 168 L134 218 Q120 221 106 218Z" fill="url(#skin)"/>

  <!-- Hair - voluminous flowing (femme icon) -->
  <!-- Hair back volume -->
  <ellipse cx="120" cy="110" rx="64" ry="62" fill="#d89820"/>
  <path d="M56 110 Q44 80 50 50 Q60 20 76 16 Q56 40 60 90Z" fill="#c08010"/>
  <path d="M184 110 Q196 80 190 50 Q180 20 164 16 Q184 40 180 90Z" fill="#c08010"/>
  <!-- Long flowing side hair -->
  <path d="M56 110 Q46 138 48 172 Q50 196 56 210 Q60 195 60 172 Q60 140 58 115Z" fill="#d89820"/>
  <path d="M184 110 Q194 138 192 172 Q190 196 184 210 Q180 195 180 172 Q180 140 182 115Z" fill="#d89820"/>
  <!-- Hair flowing down over shoulder hints -->
  <path d="M56 210 Q50 235 52 260" stroke="#c08010" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M184 210 Q190 235 188 260" stroke="#c08010" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Face -->
  <path d="M57 112 Q57 74 84 55 Q100 45 120 44 Q140 45 156 55 Q183 74 183 112 Q186 148 176 168 Q162 192 120 194 Q78 192 64 168 Q54 148 57 112Z" fill="url(#skin)"/>

  <!-- Ear -->
  <ellipse cx="57" cy="122" rx="10" ry="13" fill="#f8c0a0"/>
  <ellipse cx="183" cy="122" rx="10" ry="13" fill="#f8c0a0"/>
  <!-- Statement earrings -->
  <circle cx="57" cy="130" r="5" fill="#e84848" filter="url(#softglow)"/>
  <circle cx="57" cy="140" r="3.5" fill="#f8c840" filter="url(#softglow)"/>
  <line x1="57" y1="135" x2="57" y2="136.5" stroke="#f8c840" stroke-width="1.5"/>
  <circle cx="183" cy="130" r="5" fill="#e84848" filter="url(#softglow)"/>
  <circle cx="183" cy="140" r="3.5" fill="#f8c840" filter="url(#softglow)"/>
  <line x1="183" y1="135" x2="183" y2="136.5" stroke="#f8c840" stroke-width="1.5"/>

  <!-- Hair front -->
  <path d="M58 112 Q62 76 88 57 Q103 47 120 46 Q137 47 152 57 Q178 76 182 112 Q170 80 152 66 Q137 55 120 54 Q103 55 88 66 Q70 80 58 112Z" fill="#e8a830"/>
  <!-- Styled bangs - side swept -->
  <path d="M78 59 Q88 48 98 52 Q92 63 84 68Z" fill="#f0b840"/>
  <path d="M98 50 Q110 44 122 48 Q118 60 108 63Z" fill="#f0b840"/>
  <path d="M122 47 Q136 44 146 52 Q136 60 128 60Z" fill="#e8a030"/>
  <path d="M148 56 Q162 65 168 78 Q156 80 148 73Z" fill="#d89020"/>
  <!-- Bold hair highlight -->
  <path d="M82 56 Q108 46 138 52" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <path d="M86 53 Q110 44 136 50" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
  <!-- Rich hair gleam -->
  <path d="M80 62 Q96 54 110 57" stroke="#f8f0c0" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Left Eye - dramatic, expressive -->
  <ellipse cx="91" cy="110" rx="18" ry="16" fill="white"/>
  <clipPath id="el"><ellipse cx="91" cy="110" rx="18" ry="16"/></clipPath>
  <ellipse cx="91" cy="111" rx="13" ry="14" fill="#c82020" clip-path="url(#el)"/>
  <ellipse cx="91" cy="112" rx="9" ry="10" fill="#600000" opacity="0.5" clip-path="url(#el)"/>
  <ellipse cx="91" cy="112" rx="7" ry="8" fill="#100000" clip-path="url(#el)"/>
  <ellipse cx="95.5" cy="105" rx="4" ry="3.5" fill="white" clip-path="url(#el)"/>
  <ellipse cx="86" cy="118" rx="2.5" ry="1.5" fill="white" opacity="0.5" clip-path="url(#el)"/>
  <!-- Full dramatic lashes -->
  <path d="M73 104 Q91 96 109 104" stroke="#100000" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Wing liner flick -->
  <path d="M73 104 Q69 99 65 95" stroke="#100000" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M109 104 Q113 99 117 95" stroke="#100000" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M78 101 Q75 96 73 92" stroke="#100000" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M104 101 Q107 96 109 93" stroke="#100000" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Red eyeliner -->
  <path d="M74 118 Q91 126 108 118" stroke="#d02020" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Right Eye -->
  <ellipse cx="149" cy="110" rx="18" ry="16" fill="white"/>
  <clipPath id="er"><ellipse cx="149" cy="110" rx="18" ry="16"/></clipPath>
  <ellipse cx="149" cy="111" rx="13" ry="14" fill="#c82020" clip-path="url(#er)"/>
  <ellipse cx="149" cy="112" rx="9" ry="10" fill="#600000" opacity="0.5" clip-path="url(#er)"/>
  <ellipse cx="149" cy="112" rx="7" ry="8" fill="#100000" clip-path="url(#er)"/>
  <ellipse cx="153.5" cy="105" rx="4" ry="3.5" fill="white" clip-path="url(#er)"/>
  <ellipse cx="144" cy="118" rx="2.5" ry="1.5" fill="white" opacity="0.5" clip-path="url(#er)"/>
  <path d="M131 104 Q149 96 167 104" stroke="#100000" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M131 104 Q127 99 123 95" stroke="#100000" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M167 104 Q171 99 175 95" stroke="#100000" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M136 101 Q133 96 131 92" stroke="#100000" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M162 101 Q165 96 167 93" stroke="#100000" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M132 118 Q149 126 166 118" stroke="#d02020" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Eyebrows - sharp arched dramatic -->
  <path d="M73 91 Q91 82 109 90" stroke="#801010" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M131 90 Q149 82 167 91" stroke="#801010" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Brow highlight -->
  <path d="M75 90 Q91 83 107 89" stroke="#f8a0a0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>

  <!-- Nose -->
  <path d="M116 136 Q120 143 124 136" stroke="#c09070" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Lips - bold red -->
  <path d="M96 154 Q120 172 144 154" stroke="#c02020" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M97 156 Q120 172 143 156 L138 166 Q120 175 102 166Z" fill="#d03030" opacity="0.75"/>
  <!-- Cupid bow -->
  <path d="M102 155 Q111 152 120 154 Q129 152 138 155" stroke="#e04040" stroke-width="1.5" fill="none"/>
  <!-- Lip gloss -->
  <path d="M108 157 Q120 163 132 158" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Cheeks - dramatic blush -->
  <ellipse cx="73" cy="140" rx="18" ry="12" fill="#e84040" opacity="0.3"/>
  <ellipse cx="167" cy="140" rx="18" ry="12" fill="#e84040" opacity="0.3"/>
  <!-- Highlight point -->
  <ellipse cx="74" cy="134" rx="6" ry="4" fill="white" opacity="0.2"/>
  <ellipse cx="166" cy="134" rx="6" ry="4" fill="white" opacity="0.2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#f0fff8"/><stop offset="100%" stop-color="#b8e8d8"/>
    </radialGradient>
    <linearGradient id="skin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#f0d8b8"/><stop offset="100%" stop-color="#d0a878"/>
    </linearGradient>
    <linearGradient id="outfit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38a888"/><stop offset="100%" stop-color="#0d5040"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#604830"/><stop offset="100%" stop-color="#2a1808"/>
    </linearGradient>
    <filter id="softglow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="300" rx="20" fill="url(#bg)"/>
  <circle cx="28" cy="258" r="55" fill="#90d8c0" opacity="0.3"/>
  <circle cx="195" cy="55" r="42" fill="#c0ecd8" opacity="0.4"/>
  <!-- Water ripple decorations -->
  <path d="M15 200 Q40 195 65 200 Q40 205 15 200Z" fill="#42b89a" opacity="0.2"/>
  <path d="M170 250 Q195 245 220 250 Q195 255 170 250Z" fill="#42b89a" opacity="0.2"/>

  <!-- Body - athletic/compression tank -->
  <path d="M15 300 Q32 250 72 228 Q97 216 120 215 Q143 216 168 228 Q208 250 225 300Z" fill="url(#outfit)"/>
  <!-- Athletic lines on tank -->
  <path d="M75 228 Q68 245 65 268 L72 268 Q75 245 82 230Z" fill="#5ac8a8" opacity="0.3"/>
  <path d="M165 228 Q172 245 175 268 L168 268 Q165 245 158 230Z" fill="#5ac8a8" opacity="0.3"/>
  <!-- Center stripe -->
  <path d="M116 215 L116 300" stroke="#5ab8a0" stroke-width="4" opacity="0.3"/>
  <path d="M124 215 L124 300" stroke="#5ab8a0" stroke-width="4" opacity="0.3"/>
  <!-- Tank collar -->
  <path d="M105 215 Q120 208 135 215" stroke="#4ab0a0" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Arm muscle hint -->
  <ellipse cx="68" cy="240" rx="15" ry="24" fill="#2a9878" opacity="0.4"/>
  <ellipse cx="172" cy="240" rx="15" ry="24" fill="#2a9878" opacity="0.4"/>

  <!-- Neck - lean athletic -->
  <path d="M107 168 Q120 164 133 168 L135 218 Q120 221 105 218Z" fill="url(#skin)"/>
  <!-- Neck shadow -->
  <path d="M107 174 Q120 171 133 174 Q131 168 120 165 Q109 168 107 174Z" fill="#c09070" opacity="0.2"/>

  <!-- Hair - messy/casual short -->
  <path d="M66 105 Q70 68 97 50 Q108 43 120 42 Q132 43 143 50 Q170 68 174 105 Q163 78 146 63 Q133 53 120 51 Q107 53 94 63 Q77 78 66 105Z" fill="url(#hair)"/>
  <!-- Messy top bits -->
  <path d="M100 50 Q108 42 116 46 Q108 54 100 52Z" fill="#503820"/>
  <path d="M124 44 Q134 42 140 49 Q132 54 124 50Z" fill="#503820"/>
  <path d="M110 43 Q120 38 130 43 Q120 50 110 43Z" fill="#604030"/>
  <!-- Highlight streak (dyed?) -->
  <path d="M95 52 Q108 44 122 46" stroke="#78d8b8" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Face - lean, angular -->
  <path d="M66 105 Q66 72 92 53 Q106 44 120 43 Q134 44 148 53 Q174 72 174 105 Q177 142 168 162 Q154 184 120 186 Q86 184 72 162 Q63 142 66 105Z" fill="url(#skin)"/>

  <!-- Ear -->
  <ellipse cx="66" cy="115" rx="9" ry="12" fill="#d8a870"/>
  <ellipse cx="174" cy="115" rx="9" ry="12" fill="#d8a870"/>
  <!-- Small stud earring -->
  <circle cx="66" cy="120" r="3" fill="#42b89a" filter="url(#softglow)"/>
  <circle cx="174" cy="120" r="3" fill="#42b89a" filter="url(#softglow)"/>

  <!-- Stubble - light -->
  <path d="M80 145 Q90 152 96 162 Q106 178 120 182 Q134 178 144 162 Q150 152 160 145 Q150 142 136 142 Q120 140 104 142 Q90 142 80 145Z" fill="#604030" opacity="0.2"/>
  <!-- Light chin stubble dots -->
  <path d="M100 152 Q112 156 120 157 Q128 156 140 152" stroke="#604030" stroke-width="0.5" stroke-dasharray="2 3" fill="none" opacity="0.5"/>
  <path d="M98 162 Q110 168 120 169 Q130 168 142 162" stroke="#604030" stroke-width="0.5" stroke-dasharray="2 3" fill="none" opacity="0.4"/>

  <!-- Left Eye - bright, energetic -->
  <path d="M75 100 Q92 92 110 100 Q110 115 92 118 Q74 115 75 100Z" fill="white"/>
  <clipPath id="el"><path d="M75 100 Q92 92 110 100 Q110 115 92 118 Q74 115 75 100Z"/></clipPath>
  <ellipse cx="92" cy="107" rx="11" ry="10.5" fill="#3a9080" clip-path="url(#el)"/>
  <ellipse cx="92" cy="108" rx="7.5" ry="7" fill="#103828" clip-path="url(#el)"/>
  <ellipse cx="95.5" cy="103" rx="3.5" ry="3" fill="white" clip-path="url(#el)"/>
  <ellipse cx="88" cy="114" rx="2" ry="1.5" fill="white" opacity="0.4" clip-path="url(#el)"/>
  <path d="M76 100 Q92 92 109 100" stroke="#102018" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M76 116 Q92 120 108 116" stroke="#305040" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Right Eye -->
  <path d="M130 100 Q148 92 166 100 Q166 115 148 118 Q130 115 130 100Z" fill="white"/>
  <clipPath id="er"><path d="M130 100 Q148 92 166 100 Q166 115 148 118 Q130 115 130 100Z"/></clipPath>
  <ellipse cx="148" cy="107" rx="11" ry="10.5" fill="#3a9080" clip-path="url(#er)"/>
  <ellipse cx="148" cy="108" rx="7.5" ry="7" fill="#103828" clip-path="url(#er)"/>
  <ellipse cx="151.5" cy="103" rx="3.5" ry="3" fill="white" clip-path="url(#er)"/>
  <ellipse cx="144" cy="114" rx="2" ry="1.5" fill="white" opacity="0.4" clip-path="url(#er)"/>
  <path d="M131 100 Q148 92 165 100" stroke="#102018" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M132 116 Q148 120 164 116" stroke="#305040" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Eyebrows - natural relaxed -->
  <path d="M76 86 Q92 79 110 86" stroke="#3a2510" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M130 86 Q148 79 164 86" stroke="#3a2510" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- One raised brow for expression -->
  <path d="M130 84 Q148 76 164 84" stroke="#3a2510" stroke-width="5" stroke-linecap="round" fill="none" opacity="0"/>

  <!-- Nose - straight, sporty -->
  <path d="M115 127 Q120 134 125 127" stroke="#b08858" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M110 129 Q115 134 120 131" stroke="#a07848" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M130 129 Q125 134 120 131" stroke="#a07848" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Mouth - wide grin -->
  <path d="M94 146 Q120 162 146 146" stroke="#906040" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M97 149 Q120 163 143 149 L140 157 Q120 165 100 157Z" fill="#c89868" opacity="0.35"/>

  <!-- Cheek athletic flush -->
  <ellipse cx="76" cy="128" rx="15" ry="9" fill="#d86840" opacity="0.15"/>
  <ellipse cx="164" cy="128" rx="15" ry="9" fill="#d86840" opacity="0.15"/>

  <!-- Teal hair streak visible -->
  <path d="M64 108 Q67 98 70 90 Q65 100 64 108Z" fill="#42b89a" opacity="0.6"/>
</svg>
